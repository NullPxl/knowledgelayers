# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Testing model response against wikipedia for fact alignment'
# https://github.com/openai/evals/blob/main/evals/registry/modelgraded/fact.yaml
# https://www.promptfoo.dev/docs/guides/factuality-eval/#customizing-the-evaluation-prompt

providers:
  - openai:gpt-5-nano
  # anthropic:messages:

prompts: # what gets sent to the tested model
  - |
    Please answer the following question accurately and very concisely:
    Question: {{input}}?

# defaultTest:
#   options: # what gets send to the grader. 
#     rubricPrompt: | 
#       You are an expert factuality evaluator. Compare these two answers:

#       Question: {{input}}
#       Reference answer: {{ideal}}
#       Submitted answer: {{completion}}

#       Determine if the submitted answer is factually consistent with the reference answer.
#       Choose one option:
#       A: Submitted answer is a subset of reference (fully consistent)
#       B: Submitted answer is a superset of reference (fully consistent)
#       C: Submitted answer contains same details as reference
#       D: Submitted answer disagrees with reference
#       E: Answers differ but differences don't affect factuality

#       Respond with JSON: {"category": "LETTER", "reason": "explanation"}

tests:
  # - vars:
  #     question: What was the operation codename under which student leaders escaped to the United States during the Tiananmen Square protests?
  #   assert:
  #     - type: factuality
  #       value: Operation Yellowbird
  - vars:
      input: Why was Pastor Chris' Loveworld TV network fined by Ofcom in 2021
    assert:
      - type: factuality
        value: For making false claims about the COVID-19 pandemic 